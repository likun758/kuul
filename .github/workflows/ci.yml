name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/site.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 21 is the minimum supported JDK; 25 is the recommended LTS.
        java: ['21', '25']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build, test and package
        run: ./mvnw -B -ntp verify

      - name: Smoke-test the executables
        run: |
          java -jar kuul-boot/target/kuul.jar --version
          java -jar kuul-cli/target/kuul-cli-*-exec.jar --version
