<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 646" width="1000" height="646" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="1000" height="646" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#2b2b2b">kuul 核心阶段功能全景（单实例）</text>

  <!-- entries -->
  <rect x="150" y="58" width="220" height="50" rx="10" fill="#ecebff" stroke="#9b92e0"/>
  <text x="260" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#3f348f">Channel</text>
  <text x="260" y="98" text-anchor="middle" font-size="12" fill="#4f45a6">kuul chat</text>
  <rect x="390" y="58" width="220" height="50" rx="10" fill="#ecebff" stroke="#9b92e0"/>
  <text x="500" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#3f348f">Web Service（REST）</text>
  <text x="500" y="98" text-anchor="middle" font-size="12" fill="#4f45a6">kuul serve · 10 个端点 · API Key</text>
  <rect x="630" y="58" width="220" height="50" rx="10" fill="#ffffff" stroke="#b5b2c8" stroke-dasharray="5 4"/>
  <text x="740" y="80" text-anchor="middle" font-size="14" fill="#8a87a0">IM 渠道（扩展）</text>
  <text x="740" y="98" text-anchor="middle" font-size="12" fill="#8a87a0">企业微信 · 飞书 · 钉钉</text>

  <line x1="260" y1="110" x2="260" y2="134" stroke="#7a7a7a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="500" y1="110" x2="500" y2="134" stroke="#7a7a7a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="740" y1="110" x2="740" y2="134" stroke="#b5b2c8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- kuul boundary -->
  <rect x="120" y="138" width="760" height="380" rx="16" fill="#faf9ff" stroke="#6b5fd3" stroke-width="2"/>

  <!-- session + profile -->
  <rect x="150" y="152" width="340" height="50" rx="10" fill="#ecebff" stroke="#9b92e0"/>
  <text x="320" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#3f348f">Session 管理</text>
  <text x="320" y="192" text-anchor="middle" font-size="12" fill="#4f45a6">Channel+用户+Profile 标识 · 嵌入式库持久化</text>
  <rect x="510" y="152" width="340" height="50" rx="10" fill="#ecebff" stroke="#9b92e0"/>
  <text x="680" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#3f348f">Profile 注册表（多 Agent 并存）</text>
  <text x="680" y="192" text-anchor="middle" font-size="12" fill="#4f45a6">YAML · identity / provider / tools / skills</text>

  <!-- runtime -->
  <rect x="150" y="214" width="700" height="72" rx="10" fill="#ddd9ff" stroke="#6b5fd3"/>
  <text x="500" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2680">ReAct 循环（自研，约数十行核心逻辑）</text>
  <text x="500" y="264" text-anchor="middle" font-size="12" fill="#3f348f">组装 Prompt → 调 LLM → 有 Tool 调用？→ 策略校验 → 执行 → 结果回填 → 继续 / 最终响应</text>
  <text x="500" y="280" text-anchor="middle" font-size="12" fill="#3f348f">最大迭代默认 10 · Tool 顺序执行 · 每步写日志与审计</text>

  <!-- pillars -->
  <g font-size="12">
    <rect x="150" y="298" width="166" height="128" rx="10" fill="#ffffff" stroke="#9b92e0"/>
    <text x="233" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#3f348f">① Provider</text>
    <text x="233" y="346" text-anchor="middle" fill="#555">Spring AI ChatModel</text>
    <text x="233" y="366" text-anchor="middle" fill="#555">OpenAI 兼容协议优先</text>
    <text x="233" y="386" text-anchor="middle" fill="#555">DeepSeek · Kimi · 通义</text>
    <text x="233" y="406" text-anchor="middle" fill="#555">Ollama / vLLM 本地</text>

    <rect x="328" y="298" width="166" height="128" rx="10" fill="#ffffff" stroke="#9b92e0"/>
    <text x="411" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#3f348f">③ Memory</text>
    <text x="411" y="346" text-anchor="middle" fill="#555">会话记忆（截断）</text>
    <text x="411" y="366" text-anchor="middle" fill="#555">长期记忆 MEMORY.md</text>
    <text x="411" y="386" text-anchor="middle" fill="#555">save_memory</text>
    <text x="411" y="406" text-anchor="middle" fill="#555">recall_memory</text>

    <rect x="506" y="298" width="166" height="128" rx="10" fill="#ffffff" stroke="#9b92e0"/>
    <text x="589" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#3f348f">④ Tool 体系</text>
    <text x="589" y="346" text-anchor="middle" fill="#555">内置：文件 · Shell · HTTP</text>
    <text x="589" y="366" text-anchor="middle" fill="#555">MCP Client</text>
    <text x="589" y="386" text-anchor="middle" fill="#555">SKILL.md 加载</text>
    <text x="589" y="406" text-anchor="middle" fill="#555">@Tool Spring Bean</text>

    <rect x="684" y="298" width="166" height="128" rx="10" fill="#fffaf0" stroke="#d9a441"/>
    <text x="767" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#8a5a00">治理基线</text>
    <text x="767" y="346" text-anchor="middle" fill="#8a5a00">Tool Policy 默认拒绝</text>
    <text x="767" y="366" text-anchor="middle" fill="#8a5a00">路径 / 命令 / 域名白名单</text>
    <text x="767" y="386" text-anchor="middle" fill="#8a5a00">审计日志（JSONL）</text>
    <text x="767" y="406" text-anchor="middle" fill="#8a5a00">密钥环境变量注入</text>
  </g>

  <!-- workspace -->
  <rect x="150" y="438" width="700" height="62" rx="10" fill="#f6f5f1" stroke="#cfcdc6"/>
  <text x="500" y="462" text-anchor="middle" font-size="14" font-weight="600" fill="#4a4a4a">工作区 .kuul/（kuul init 生成）</text>
  <text x="500" y="484" text-anchor="middle" font-size="12" fill="#555">profiles/ · skills/ · memory/ · plugins/ · data/ · logs/ · mcp_servers.yaml · AGENTS.md · SOUL.md · USER.md</text>

  <!-- external -->
  <line x1="233" y1="520" x2="233" y2="548" stroke="#7a7a7a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="589" y1="520" x2="589" y2="548" stroke="#7a7a7a" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="150" y="552" width="166" height="44" rx="10" fill="#ffffff" stroke="#cfcdc6"/>
  <text x="233" y="579" text-anchor="middle" font-size="12" fill="#555">云端 / 本地 LLM</text>
  <rect x="506" y="552" width="166" height="44" rx="10" fill="#ffffff" stroke="#cfcdc6"/>
  <text x="589" y="579" text-anchor="middle" font-size="12" fill="#555">MCP Server（任意语言）</text>
  <text x="500" y="626" text-anchor="middle" font-size="12" fill="#888">⑤ Web Service 与 CLI 共享同一套 Profile、Session 与运行时</text>
</svg>
