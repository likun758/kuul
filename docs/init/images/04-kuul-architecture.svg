<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#2b2b2b">kuul 能力蓝图（完整形态 · 单实例视图）</text>

  <!-- users -->
  <rect x="140" y="56" width="720" height="44" rx="10" fill="#f6f5f1" stroke="#cfcdc6"/>
  <text x="500" y="84" text-anchor="middle" font-size="14" fill="#4a4a4a">最终用户 · 业务系统 · 编排平台（Dify 等，通过 API 调用）</text>
  <line x1="500" y1="102" x2="500" y2="122" stroke="#7a7a7a" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- kuul boundary -->
  <rect x="120" y="126" width="760" height="470" rx="16" fill="#faf9ff" stroke="#6b5fd3" stroke-width="2"/>
  <text x="140" y="150" font-size="14" font-weight="700" fill="#3f348f">kuul（Spring Boot 应用 · 私有部署）</text>

  <!-- channels -->
  <rect x="150" y="162" width="700" height="52" rx="10" fill="#ecebff" stroke="#9b92e0"/>
  <text x="500" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#3f348f">渠道层 Channel</text>
  <text x="500" y="205" text-anchor="middle" font-size="12" fill="#4f45a6">企业微信 · 飞书 · 钉钉 · Slack · 邮件 · Web · HTTP API</text>

  <!-- gateway -->
  <rect x="150" y="224" width="700" height="52" rx="10" fill="#ecebff" stroke="#9b92e0"/>
  <text x="500" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#3f348f">网关 Gateway（控制平面）</text>
  <text x="500" y="267" text-anchor="middle" font-size="12" fill="#4f45a6">接入鉴权 · 消息路由 · 会话管理 · 租户识别 · 限流</text>

  <!-- runtime -->
  <rect x="150" y="286" width="700" height="62" rx="10" fill="#ddd9ff" stroke="#6b5fd3"/>
  <text x="500" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2680">Agent 运行时 Runtime</text>
  <text x="500" y="334" text-anchor="middle" font-size="12" fill="#3f348f">Agent 配置与生命周期 · Agent Loop · 上下文工程 · 定时 / 心跳 · 人工审批节点 · 中断与恢复</text>

  <!-- pillars -->
  <g font-size="12">
    <rect x="150" y="358" width="166" height="130" rx="10" fill="#ffffff" stroke="#9b92e0"/>
    <text x="233" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#3f348f">模型路由</text>
    <text x="233" y="410" text-anchor="middle" fill="#555">LLM Provider 抽象</text>
    <text x="233" y="430" text-anchor="middle" fill="#555">多模型 / 私有模型</text>
    <text x="233" y="450" text-anchor="middle" fill="#555">配额与成本</text>
    <text x="233" y="470" text-anchor="middle" fill="#555">基于 Spring AI</text>

    <rect x="328" y="358" width="166" height="130" rx="10" fill="#ffffff" stroke="#9b92e0"/>
    <text x="411" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#3f348f">工具与技能</text>
    <text x="411" y="410" text-anchor="middle" fill="#555">Tool 注册（MCP）</text>
    <text x="411" y="430" text-anchor="middle" fill="#555">SKILL.md 兼容</text>
    <text x="411" y="450" text-anchor="middle" fill="#555">审核 · 签名 · 版本</text>
    <text x="411" y="470" text-anchor="middle" fill="#555">强制沙箱执行</text>

    <rect x="506" y="358" width="166" height="130" rx="10" fill="#ffffff" stroke="#9b92e0"/>
    <text x="589" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#3f348f">记忆与知识</text>
    <text x="589" y="410" text-anchor="middle" fill="#555">会话 / 长期记忆</text>
    <text x="589" y="430" text-anchor="middle" fill="#555">检索与压缩</text>
    <text x="589" y="450" text-anchor="middle" fill="#555">经验沉淀为 Skill</text>
    <text x="589" y="470" text-anchor="middle" fill="#555">租户 / 部门边界</text>

    <rect x="684" y="358" width="166" height="130" rx="10" fill="#fff4f2" stroke="#c9776c"/>
    <text x="767" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#8c3a2e">安全与治理</text>
    <text x="767" y="410" text-anchor="middle" fill="#7a3328">多租户 · RBAC · SSO</text>
    <text x="767" y="430" text-anchor="middle" fill="#7a3328">策略引擎 · 最小授权</text>
    <text x="767" y="450" text-anchor="middle" fill="#7a3328">凭证托管（KMS）</text>
    <text x="767" y="470" text-anchor="middle" fill="#7a3328">全链路审计</text>
  </g>

  <!-- observability -->
  <rect x="150" y="498" width="700" height="44" rx="10" fill="#ecebff" stroke="#9b92e0"/>
  <text x="500" y="525" text-anchor="middle" font-size="13" fill="#3f348f">可观测：Prometheus 指标 · OpenTelemetry 追踪 · 结构化日志 · 健康检查</text>

  <!-- console -->
  <rect x="150" y="550" width="700" height="34" rx="8" fill="#f6f5f1" stroke="#cfcdc6"/>
  <text x="500" y="572" text-anchor="middle" font-size="13" fill="#4a4a4a">Web 管理台 / CLI：配置 Agent、注册 Tool 与 Skill、绑定渠道、查看审计</text>

  <!-- south -->
  <line x1="500" y1="598" x2="500" y2="618" stroke="#7a7a7a" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <g font-size="12">
    <rect x="120" y="622" width="240" height="60" rx="10" fill="#f6f5f1" stroke="#cfcdc6"/>
    <text x="240" y="646" text-anchor="middle" font-size="13" font-weight="600" fill="#3a3a3a">模型</text>
    <text x="240" y="668" text-anchor="middle" fill="#555">外部 API · vLLM · Ollama</text>

    <rect x="380" y="622" width="240" height="60" rx="10" fill="#f6f5f1" stroke="#cfcdc6"/>
    <text x="500" y="646" text-anchor="middle" font-size="13" font-weight="600" fill="#3a3a3a">工具与企业系统</text>
    <text x="500" y="668" text-anchor="middle" fill="#555">MCP Server（任意语言）· ERP / CRM / CMDB</text>

    <rect x="640" y="622" width="240" height="60" rx="10" fill="#f6f5f1" stroke="#cfcdc6"/>
    <text x="760" y="646" text-anchor="middle" font-size="13" font-weight="600" fill="#3a3a3a">企业基础设施</text>
    <text x="760" y="668" text-anchor="middle" fill="#555">IAM / SSO · KMS · SIEM · APM</text>
  </g>
</svg>
