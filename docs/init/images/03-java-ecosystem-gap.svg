<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#2b2b2b">Java 企业技术栈：每一层都有成熟实现，唯独 Agent OS 层是空的</text>

  <!-- column headers -->
  <text x="150" y="80" text-anchor="middle" font-size="14" fill="#8a8a8a">层级</text>
  <text x="560" y="80" text-anchor="middle" font-size="14" fill="#8a8a8a">Java / Spring 生态</text>
  <text x="890" y="80" text-anchor="middle" font-size="14" fill="#8a8a8a">其他语言生态</text>

  <!-- Agent OS row (gap) -->
  <text x="150" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#a8372b">Agent OS</text>
  <rect x="300" y="96" width="520" height="62" rx="10" fill="#fff6f5" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="560" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#a8372b">缺位 —— kuul 要补的位置</text>
  <text x="560" y="146" text-anchor="middle" font-size="12" fill="#a8605a">仅有 JavaClaw、solonclaw 等早期个人项目</text>
  <rect x="840" y="96" width="110" height="62" rx="10" fill="#fdecea" stroke="#c9776c"/>
  <text x="895" y="122" text-anchor="middle" font-size="13" fill="#8c3a2e">OpenClaw（TS）</text>
  <text x="895" y="144" text-anchor="middle" font-size="13" fill="#1f5e45">Hermes（Py）</text>

  <!-- rows -->
  <g font-size="15">
    <text x="150" y="204" text-anchor="middle" fill="#3a3a3a">Agent 编程框架</text>
    <rect x="300" y="174" width="520" height="50" rx="10" fill="#e8f0fb" stroke="#7aa0d4"/>
    <text x="560" y="205" text-anchor="middle" fill="#1f4f8a">Embabel 1.5 · AgentScope Java 2.0 · Google ADK Java</text>

    <text x="150" y="268" text-anchor="middle" fill="#3a3a3a">LLM 调用层</text>
    <rect x="300" y="238" width="520" height="50" rx="10" fill="#e8f0fb" stroke="#7aa0d4"/>
    <text x="560" y="269" text-anchor="middle" fill="#1f4f8a">Spring AI 2.1 · LangChain4j 1.24 · Spring AI Alibaba</text>

    <text x="150" y="332" text-anchor="middle" fill="#3a3a3a">可观测与诊断</text>
    <rect x="300" y="302" width="520" height="50" rx="10" fill="#e8f0fb" stroke="#7aa0d4"/>
    <text x="560" y="333" text-anchor="middle" fill="#1f4f8a">SkyWalking · Prometheus + Grafana · Arthas · JFR · OTel Java</text>

    <text x="150" y="396" text-anchor="middle" fill="#3a3a3a">微服务治理</text>
    <rect x="300" y="366" width="520" height="50" rx="10" fill="#e8f0fb" stroke="#7aa0d4"/>
    <text x="560" y="397" text-anchor="middle" fill="#1f4f8a">Spring Cloud · Nacos · Sentinel · Spring Cloud Gateway</text>

    <text x="150" y="460" text-anchor="middle" fill="#3a3a3a">安全与身份</text>
    <rect x="300" y="430" width="520" height="50" rx="10" fill="#e8f0fb" stroke="#7aa0d4"/>
    <text x="560" y="461" text-anchor="middle" fill="#1f4f8a">Spring Security · OAuth2 / OIDC · Keycloak · Vault / KMS</text>

    <text x="150" y="524" text-anchor="middle" fill="#3a3a3a">应用框架</text>
    <rect x="300" y="494" width="520" height="50" rx="10" fill="#e8f0fb" stroke="#7aa0d4"/>
    <text x="560" y="525" text-anchor="middle" fill="#1f4f8a">Spring Boot 3.x / 4.x</text>

    <text x="150" y="588" text-anchor="middle" fill="#3a3a3a">运行平台</text>
    <rect x="300" y="558" width="520" height="50" rx="10" fill="#e8f0fb" stroke="#7aa0d4"/>
    <text x="560" y="589" text-anchor="middle" fill="#1f4f8a">JDK 21 / 25（虚拟线程）· GraalVM Native Image</text>
  </g>

  <text x="895" y="300" text-anchor="middle" font-size="12" fill="#8a8a8a">跨栈接入需要</text>
  <text x="895" y="320" text-anchor="middle" font-size="12" fill="#8a8a8a">大量胶水代码</text>
  <line x1="895" y1="164" x2="895" y2="280" stroke="#c9b7b3" stroke-width="1.4" stroke-dasharray="4 4"/>
</svg>
